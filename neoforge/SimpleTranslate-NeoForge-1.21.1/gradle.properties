org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.243
# Floor justification (NF-121A 2026-07-27): this target's mixins use
# MixinExtras @WrapMethod, and NeoForge bundles MixinExtras >= 0.4.1 (first
# version with @WrapMethod) starting exactly at 21.1.22 (official changelog
# entry "21.1.22 Update dependency io.github.llamalad7:mixinextras-neoforge
# to v0.4.1 (#1463)"). Every other NeoForge API this mod uses predates the
# 21.1 series (config screen UI 21.0.110-beta, payload API 20.5+, tick-event
# split 20.5.14-beta). Minimum-compatible floor, not a build pin.
neo_version_range=[21.1.22,21.2)
loader_version_range=[1,)
java_version=21
gradle_java_version=21

mod_version=2.1.28
maven_group=com.yourname.simpletranslate
archives_base_name=simple_translate

mod_id=simple_translate
mod_name=Simple Translate
mod_license=MIT
mod_authors=baokaixing
mod_description=AI-powered in-game translation for chat, tooltips, books, signs, HUD, entity names, and other Minecraft text, with caching and configurable settings.

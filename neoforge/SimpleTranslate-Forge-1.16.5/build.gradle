plugins {
    id "net.minecraftforge.gradle" version "[6.0,6.2)"
    id "org.spongepowered.mixin" version "0.7.+"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-forge"
}

minecraft {
    mappings channel: "official", version: project.minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            mods {
                simple_translate {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "simple_translate.refmap.json"
    config "simple_translate.mixins.json"
}

def generatedMixinResources = layout.buildDirectory.dir("generated/simpletranslate/mixin-resources")

sourceSets {
    main {
        resources.srcDir(generatedMixinResources)
    }
}

repositories {
    mavenCentral()
}

configurations {
    shadeIntoJar
    implementation.extendsFrom(shadeIntoJar)
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly "org.jetbrains:annotations:24.1.0"
    // Forge 1.16.5 predates JarJar (nested jars in META-INF/jarjar are
    // ignored by FML 36.x — runtime-proven 2026-07-27: mixin apply crashed
    // with ClassMetadataNotFoundException for the MixinExtras Operation
    // class). Shade mixinextras-common directly into the production jar and
    // bootstrap it from SimpleTranslateMixinPlugin#onLoad instead.
    shadeIntoJar "io.github.llamalad7:mixinextras-common:0.4.1"
    // MixinExtras injectors (@WrapOperation etc.) need their own annotation
    // processor on the AP path, otherwise the Mixin refmap omits their
    // @At("INVOKE") targets and production SRG runtimes fail injection checks
    // (observed: ScoreboardMixin#wrapSidebarTitle 0/1 on Forge 43.5.2).
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"
}

processResources {
    inputs.properties(
            version: project.version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_description: project.mod_description,
            mod_authors: project.mod_authors,
            mod_license: project.mod_license,
            forge_version: project.forge_version,
            minecraft_version: project.minecraft_version
    )

    filesMatching("META-INF/mods.toml") {
        expand(
                version: project.version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_description: project.mod_description,
                mod_authors: project.mod_authors,
                mod_license: project.mod_license,
                forge_version: project.forge_version,
                minecraft_version: project.minecraft_version
        )
    }
}

def targetJava = Integer.parseInt(project.java_version)

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
    withSourcesJar()
}

tasks.named("compileJava", JavaCompile).configure {
    // ForgeGradle 6 also discovers the JDK8 toolchain needed by the 1.16.5
    // MCP step; pin the actual mod compiler to the requested Java 17 toolchain
    // so Gradle does not send --release to javac 8.
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(targetJava)
    }
    it.options.release = targetJava
    it.options.encoding = "UTF-8"
    it.outputs.cacheIf { false }
    it.doLast {
        def refmapFile = file("$buildDir/tmp/compileJava/simple_translate.refmap.json")
        if (!refmapFile.exists()) {
            refmapFile = file("$buildDir/tmp/compileJava/compileJava-refmap.json")
        }
        if (!refmapFile.exists()) {
            throw new GradleException("Mixin refmap was not generated by compileJava.")
        }
        copy {
            from refmapFile
            into generatedMixinResources.get().asFile
            rename { "simple_translate.refmap.json" }
        }
    }
}

tasks.named("processResources").configure {
    dependsOn tasks.named("compileJava")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(provider { configurations.shadeIntoJar.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "module-info.class", "LICENSE*"
    }
    // 1.16.5 logoFile must be a jar-root filename (see META-INF/mods.toml).
    from("src/main/resources/assets/simple_translate/icon.png") {
        rename { "simple_translate_logo.png" }
    }
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.mod_name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : project.mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "simple_translate.mixins.json"
        ])
    }
}

jar.finalizedBy("reobfJar")

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}

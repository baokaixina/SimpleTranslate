buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = project.mod_version
group = project.maven_group

base {
    archivesBaseName = "${project.archives_base_name}-${project.minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                simple_translate {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'simple_translate.refmap.json'
    config 'simple_translate.mixins.json'
}

def generatedMixinResources = layout.buildDirectory.dir('generated/simpletranslate/mixin-resources')
sourceSets.main.resources { srcDir generatedMixinResources }

repositories {
    mavenCentral()
}

configurations {
    embed
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation 'io.github.llamalad7:mixinextras-common:0.4.1'
    embed 'io.github.llamalad7:mixinextras-common:0.4.1'
}

processResources {
    inputs.properties(
            version: project.version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_description: project.mod_description,
            mod_authors: project.mod_authors,
            mod_license: project.mod_license,
            forge_version: project.forge_version,
            minecraft_version: project.minecraft_version
    )
    filesMatching('META-INF/mods.toml') {
        expand(
                version: project.version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_description: project.mod_description,
                mod_authors: project.mod_authors,
                mod_license: project.mod_license,
                forge_version: project.forge_version,
                minecraft_version: project.minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources').configure {
    dependsOn tasks.named('compileJava')
}

tasks.named('compileJava').configure {
    outputs.cacheIf { false }
    doLast {
        def refmapFile = file("$buildDir/tmp/compileJava/simple_translate.refmap.json")
        if (!refmapFile.exists()) {
            refmapFile = file("$buildDir/tmp/compileJava/compileJava-refmap.json")
        }
        if (!refmapFile.exists()) {
            throw new GradleException('Mixin refmap was not generated by compileJava.')
        }
        copy {
            from refmapFile
            into generatedMixinResources.get().asFile
            rename { 'simple_translate.refmap.json' }
        }
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.embed.collect { dependency ->
            zipTree(dependency).matching {
                exclude 'META-INF/MANIFEST.MF', 'META-INF/mods.toml', 'META-INF/jarjar/**', 'META-INF/jars/**'
            }
        }
    }
    manifest {
        attributes([
                'Specification-Title': project.mod_id,
                'Specification-Vendor': project.mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': project.mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': 'simple_translate.mixins.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
}

modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
clientSideOnly=false
showAsResourcePack=false

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="assets/simple_translate/icon.png"
description='''${mod_description}'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
# Minimum compatible Forge floor for MC 1.20.1 (47.x era), not the build version.
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.20.2)"
ordering="NONE"
side="BOTH"

plugins {
    id "net.minecraftforge.gradle" version "[6.0,6.2)"
    id "org.spongepowered.mixin" version "0.7.+"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}-neoforge"
}

minecraft {
    mappings channel: "official", version: project.minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            mods {
                simple_translate {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "simple_translate.refmap.json"
    config "simple_translate.mixins.json"
}

def generatedMixinResources = layout.buildDirectory.dir("generated/simpletranslate/mixin-resources")

sourceSets {
    main {
        resources.srcDir(generatedMixinResources)
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    mavenCentral()
}

dependencies {
    minecraft "net.neoforged:forge:${project.minecraft_version}-${project.neoforge_version}"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly "org.jetbrains:annotations:24.1.0"
    // MixinExtras is not bundled with NeoForge 47.1.x (bundling starts with
    // NeoForge 20.6); compile against mixinextras-common and embed the
    // Forge bootstrap jar (which carries the real nested MixinExtras jar)
    // via JarJar so production clients get it too.
    compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
    // MixinExtras ships an AP extension that teaches the Mixin AP to remap
    // @WrapOperation/@WrapWithCondition targets into the refmap. ForgeGradle
    // only sees annotationProcessor-path deps, so it must be listed here or
    // every MixinExtras injector keeps unmapped (mojmap) targets at runtime.
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.4.1"
    jarJar(group: "io.github.llamalad7", name: "mixinextras-forge", version: "[0.4.1,0.5.0)")
}

jarJar {
    enable()
}

// The deployable artifact is the JarJar-combined jar: NeoForge 47.1.x does
// not bundle MixinExtras, so the main (classifier-less) jar must carry the
// nested mixinextras-forge jar. The plain classes-only jar is demoted to a
// dev-shadow classifier that deploy scripts skip.
tasks.named("jarJar") {
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.mod_name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : project.mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "simple_translate.mixins.json"
        ])
    }
}

processResources {
    inputs.properties(
            version: project.version,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_description: project.mod_description,
            mod_authors: project.mod_authors,
            mod_license: project.mod_license,
            neoforge_version: project.neoforge_version,
            neoforge_version_floor: project.neoforge_version_floor,
            minecraft_version: project.minecraft_version
    )

    filesMatching("META-INF/mods.toml") {
        expand(
                version: project.version,
                mod_id: project.mod_id,
                mod_name: project.mod_name,
                mod_description: project.mod_description,
                mod_authors: project.mod_authors,
                mod_license: project.mod_license,
                neoforge_version: project.neoforge_version,
                neoforge_version_floor: project.neoforge_version_floor,
                minecraft_version: project.minecraft_version
        )
    }
}

def targetJava = Integer.parseInt(project.java_version)

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = targetJava
    it.options.encoding = "UTF-8"
    it.outputs.cacheIf { false }
    it.doLast {
        def refmapFile = file("$buildDir/tmp/compileJava/simple_translate.refmap.json")
        if (!refmapFile.exists()) {
            refmapFile = file("$buildDir/tmp/compileJava/compileJava-refmap.json")
        }
        if (!refmapFile.exists()) {
            throw new GradleException("Mixin refmap was not generated by compileJava.")
        }
        copy {
            from refmapFile
            into generatedMixinResources.get().asFile
            rename { "simple_translate.refmap.json" }
        }
    }
}

tasks.named("processResources").configure {
    dependsOn tasks.named("compileJava")
}

jar {
    archiveClassifier = 'dev-shadow'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title"     : project.mod_id,
                "Specification-Vendor"    : project.mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.mod_name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : project.mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "simple_translate.mixins.json"
        ])
    }
}

jar.finalizedBy("reobfJar")

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named("jarJar")
        }
    }
}

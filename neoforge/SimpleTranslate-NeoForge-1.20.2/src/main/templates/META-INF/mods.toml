modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
clientSideOnly=false
showAsResourcePack=false

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="assets/simple_translate/icon.png"
description='''${mod_description}'''
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="simple_translate.mixins.json"

# NeoForge 20.2.x FML (fmlVersion 1.0.16) still requires the Forge-era
# boolean `mandatory` key; the `type="required"` form is a later-era schema
# and makes FML reject the whole mod file as invalid
# (InvalidModFileException: Missing required field mandatory in dependency,
# observed on the exact 20.2.93 test client, 2026-07-26).
[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
